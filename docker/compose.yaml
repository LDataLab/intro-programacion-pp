services:
  bashquiz:
    build: ./bashquiz
    image: bashquizclase
    stdin_open: true
    tty: true

  api:
    build: ./api
    image: irisclase
    ports:
      - "13000:13000"
  neo4j:
    build: ./neo4j
    image: neo4jclase
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/dockerclase123
    volumes:
      - neo4j_data:/data
volumes:
  neo4j_data:
