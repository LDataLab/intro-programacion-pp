[project]
name = "intro-programacion-pp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dash>=4.5.0",
    "duckdb>=2.0.0",
    "fastapi>=0.162.5",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "jupyter-cache>=1.0.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/progra"]
